<!DOCTYPE html>
<html>

<head>
    <title>Mini Car</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="panel">
        <h2>MiniCar</h2>

        <div id="velocimetro">
            <span id="velocidad">0</span>
            <small>km/h</small>
        </div>

        <p>Marca: Toyota</p>
        <p>Modelo: Corolla</p>
        <p>Estado: <span id="estado">Apagado</span></p>
    </div>


    <button id="btnEncender" class="btn-encender">Encender</button>
    <button id="btnAcelerar" class="btn-acelerar">Acelerar</button>
    <button id="btnFrenar" class="btn-frenar">Frenar</button>
    <button id="btnApagar" class="btn-apagar">Apagar</button>


    <div id="carretera">
        <div id="lineaCarril"></div>
        <div id="carro">
            <div class="carroceria">
                <div class="ventana ventana-izquierda"></div>
                <div class="ventana ventana-derecha"></div>
            </div>
            <div class="rueda rueda-izquierda"></div>
            <div class="rueda rueda-derecha"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
